name: Build und Deploy

on:
  push:
    branches: ['**'] # jeder Branch wird gebaut und geprüft …
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # für den Push in den Branch gh-pages

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Guard-Gate – Formatierung (Prettier)
        run: npm run format:check

      - name: Guard-Gate – Lint (ESLint)
        run: npm run lint

      - name: Guard-Gate – Architekturregeln (dependency-cruiser)
        run: npm run arch

      - name: Guard-Gate – Typen und Inhalte prüfen
        run: npm run check

      - name: Guard-Gate – Unit-Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Guard-Gate – HTML und interne Links der fertigen Seite
        run: npm run verify

      # … aber nur main wird veröffentlicht
      - name: Deploy auf GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
