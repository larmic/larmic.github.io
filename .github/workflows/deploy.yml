name: Build und Deploy

# Prüfen: jeder Pull Request (auch von Renovate) und jeder Push auf main – mit allen Guard-Gates.
# Veröffentlichen: nur Pushes auf main, in einem eigenen Job.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

# Standard: nur lesen. Install-Skripte frisch aktualisierter Pakete (Renovate) laufen damit ohne Schreib-Token.
permissions:
  contents: read

jobs:
  gates:
    name: Guard-Gates und Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gates-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Guard-Gate – Formatierung (Prettier)
        run: npm run format:check

      - name: Guard-Gate – Lint (ESLint)
        run: npm run lint

      - name: Guard-Gate – Architekturregeln (dependency-cruiser)
        run: npm run arch

      - name: Guard-Gate – Typen und Inhalte prüfen
        run: npm run check

      - name: Guard-Gate – Unit-Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Guard-Gate – HTML und interne Links der fertigen Seite
        run: npm run verify

      - name: Fertige Seite für den Deploy-Job bereitstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          include-hidden-files: true # .nojekyll, sonst verschluckt GitHub Pages den Ordner _astro/
          retention-days: 1

  deploy:
    name: Deploy auf GitHub Pages
    needs: gates
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nur dieser Job darf schreiben (Push in den Branch gh-pages); er baut nichts und installiert nichts.
    permissions:
      contents: write
    # Deploys nie abbrechen, nacheinander ausführen
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
